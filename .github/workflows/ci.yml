name: CI

# Pipeline CI do frontend web, no modelo da pipeline do backend: QG-01 (build, com a verificação de tipos da
# aplicação e dos testes), QG-05 (ESLint, Prettier e análise SonarQube com o Quality Gate «Katch QG-05») e a
# cobertura mínima de 40% das linhas dos testes unitários (Jest) e QG-06 (testes de sistema Playwright, I079), contra
# a API do katch-backend e o PostgreSQL com os dados de demonstração, com o frontend servido por vite preview.
# Corre em cada Merge Request para a main e em cada push na main; a regra de proteção da main exige os dois jobs com
# sucesso antes do merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  # Endereço da API usado no build; vem das variáveis do repositório (sem segredos), se existir.
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      # Base de dados da API usada pelos testes de sistema (QG-06), com locale UTF-8 (database/README.md do backend).
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: katch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: QG-01 Build (tsc e Vite)
        run: npm run build

      - name: QG-05 ESLint
        run: npm run lint

      - name: QG-05 Prettier
        run: npm run format:check

      - name: Testes unitários e cobertura de linhas ≥ 40% (Jest)
        run: |
          npm run test:coverage -- --ci
          node -e "const s=require('./coverage/coverage-summary.json').total.lines; console.log('Cobertura de linhas: ' + s.pct + '%')"

      - name: Resumo da cobertura
        if: always()
        run: |
          if [[ -f coverage/coverage-summary.json ]]; then
            pct="$(jq -r '.total.lines.pct' coverage/coverage-summary.json)"
            {
              echo "## Testes unitários (Jest)"
              echo
              echo "Cobertura de linhas: **${pct}%** (mínimo: 40%)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # QG-06 — testes de sistema (I079). A API corre a partir da main do katch-backend, sobre a base criada pelos
      # scripts 01 a 03 (esquema, listas e dados de demonstração). As palavras-passe vêm dos segredos do repositório.
      - name: QG-06 Obter o katch-backend
        uses: actions/checkout@v4
        with:
          repository: katch-lds/katch-backend
          ref: main
          path: katch-backend
          token: ${{ secrets.KATCH_BACKEND_TOKEN || github.token }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: QG-06 Base de dados com os dados de demonstração
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          for script in 01-create-schema 02-seed-reference-data 03-seed-demo-data; do
            # -v demo=1: o script 03 só aceita correr numa base de desenvolvimento ou de demonstração.
            psql -d katch -v ON_ERROR_STOP=1 -v demo=1 -q -f "katch-backend/database/${script}.sql"
          done

      # As palavras-passe de demonstração não estão no repositório (só os resumos). Para a pipeline não depender delas,
      # as contas de demonstração e o Administrador recebem resumos novos (formato V3 do ASP.NET Core Identity:
      # PBKDF2-HMAC-SHA512, 100 000 iterações, sal de 16 bytes) das palavras-passe guardadas nos segredos.
      - name: QG-06 Palavras-passe das contas de teste
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          E2E_DEMO_PASSWORD: ${{ secrets.E2E_DEMO_PASSWORD }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          python3 - > e2e-passwords.sql <<'PY'
          import base64, hashlib, os, struct

          def identity_v3(password: str) -> str:
              salt = os.urandom(16)
              subkey = hashlib.pbkdf2_hmac('sha512', password.encode('utf-8'), salt, 100_000, 32)
              header = b'\x01' + struct.pack('>III', 2, 100_000, len(salt))
              return base64.b64encode(header + salt + subkey).decode('ascii')

          demo = identity_v3(os.environ['E2E_DEMO_PASSWORD'])
          admin = identity_v3(os.environ['E2E_ADMIN_PASSWORD'])
          print(f"UPDATE app_user SET password_hash = '{demo}' WHERE email LIKE '%@demo.katch.pt';")
          print(f"UPDATE app_user SET password_hash = '{admin}' WHERE email = 'admin@katch.pt';")
          PY
          psql -d katch -v ON_ERROR_STOP=1 -q -f e2e-passwords.sql
          rm e2e-passwords.sql

      - name: QG-06 Arrancar a API
        env:
          ConnectionStrings__Katch: Host=localhost;Port=5432;Database=katch;Username=postgres;Password=postgres
          Cors__AllowedOrigins: http://localhost:4173
          # Os 40 testes criam contas e iniciam sessão a partir do mesmo IP em poucos minutos: os limites por IP da API
          # (Limits, por omissão 10 por minuto) são alargados só nesta instância de teste (ERR-14 da I136).
          Limits__LoginPermitLimit: '1000'
          Limits__RegistrationPermitLimit: '1000'
          Limits__LocationsPermitLimit: '1000'
          Limits__UserPermitLimit: '10000'
        run: |
          export Jwt__Secret="$(openssl rand -hex 32)"
          nohup dotnet run --project katch-backend/src/Katch.Backend --launch-profile http > api.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -s -o /dev/null http://localhost:5180/swagger/index.html; then echo "API pronta"; exit 0; fi
            sleep 2
          done
          cat api.log
          exit 1

      - name: QG-06 Testes de sistema (Playwright)
        env:
          E2E_API_URL: http://localhost:5180
          E2E_DEMO_PASSWORD: ${{ secrets.E2E_DEMO_PASSWORD }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Publicar relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Registo da API
        if: always()
        run: if [[ -f api.log ]]; then tail -n 200 api.log; fi

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore

  static-analysis:
    name: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Instância SonarQube Community Build criada para cada execução e configurada por
      # scripts/sonarqube/configure.sh (Quality Profile «Sonar way» de TypeScript e JavaScript e Quality Gate
      # «Katch QG-05»), como no backend.
      sonarqube:
        image: sonarqube:26.10.0.133078-community
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
        ports:
          - 9000:9000
    env:
      SONAR_HOST_URL: http://localhost:9000
      SONAR_PROJECT_KEY: katch-frontend-web
      SONAR_LANGUAGES: 'ts js'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Configurar a instância SonarQube
        env:
          SONAR_ADMIN_PASSWORD: ${{ secrets.SONAR_ADMIN_PASSWORD }}
        run: bash scripts/sonarqube/configure.sh

      - name: QG-05 Testes para a cobertura importada
        run: npm run test:coverage -- --ci

      - name: QG-05 Análise SonarQube e Quality Gate
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectVersion=${{ github.sha }}

      - name: Exportar o relatório SonarQube
        if: always()
        run: |
          if [[ -n "${SONAR_TOKEN:-}" ]]; then
            bash scripts/sonarqube/export-report.sh && cat sonarqube-report/resumo.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar o relatório SonarQube
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-report
          path: sonarqube-report
          if-no-files-found: ignore
